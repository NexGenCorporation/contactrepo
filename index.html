<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: #0a0f1d;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Tekstualni logo identičan onom sa glavnog sajta */
        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: #3b82f6;
            letter-spacing: -1px;
            margin-bottom: 25px;
        }
        .logo-text span {
            background: #22c55e;
            color: #020617;
            padding: 2px 8px;
            font-size: 1.1rem;
            border-radius: 6px;
            vertical-align: middle;
            margin-right: 8px;
            font-weight: 800;
        }

        h1 {
            color: #3b82f6;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 400px;
            line-height: 1.4;
        }
        .info {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 22px;
            display: inline-block;
            text-align: left;
            width: 100%;
            max-width: 360px;
            margin-bottom: 40px;
        }
        .info p {
            margin-bottom: 14px;
            font-size: 1.05rem;
        }
        .info p:last-child {
            margin-bottom: 0;
        }
        a {
            color: #22c55e;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            font-size: 0.9rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        footer span {
            background: #22c55e;
            color: #020617;
            padding: 2px 6px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <!-- Tekstualni logo koji menja slomljenu sliku -->

        <div class="info">

            <p><strong>Home:</strong> <a href="https://nxgcorp.dpdns.org">nxgcorp.dpdns.org</a></p>
