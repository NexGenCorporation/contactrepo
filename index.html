<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0a0f1d; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
        .card { background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; margin: auto; display: flex; flex-direction: column; gap: 15px; }
        h2 { text-align: center; color: #3b82f6; }
        .screen { display: none; flex-direction: column; gap: 12px; }
        .screen.active { display: flex; }
        .btn { background: #1f2937; border: 1px solid #374151; padding: 12px; border-radius: 8px; color: #ffffff; font-weight: bold; cursor: pointer; text-align: center; width: 100%; }
        .primary-btn { background: #3b82f6; border: none; }
        input { background: #030712; border: 1px solid #374151; border-radius: 8px; padding: 12px; color: #ffffff; outline: none; width: 100%; }
        .chat-messages { height: 250px; background: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 0.95rem; word-break: break-word; }
        .msg.user { background: #1f2937; align-self: flex-start; border-left: 3px solid #3b82f6; }
        .msg.support { background: #064e3b; align-self: flex-end; border-right: 3px solid #22c55e; }
        .msg-meta { font-size: 0.75rem; color: #64748b; margin-bottom: 2px; font-weight: bold; }
        footer { font-size: 0.85rem; color: #4b5563; text-align: center; }
        footer span { background: #22c55e; color: #020617; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-right: 4px; }
    </style>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>
    <div class="card">
        <h2>NexGen Live Hub</h2>
        <div id="screen-choice" class="screen active">
            <button class="btn primary-btn" onclick="switchScreen('screen-user-login')">Need Help</button>
            <button class="btn" onclick="checkSupportPass()">Support (Staff Only)</button>
        </div>
        <div id="screen-user-login" class="screen">
            <input type="text" id="user-alias" placeholder="Enter your Name / Alias">
            <button class="btn primary-btn" onclick="loginAsUser()">Enter Chat</button>
            <button class="btn" onclick="switchScreen('screen-choice')">Back</button>
        </div>
        <div id="screen-chat" class="screen">
            <div class="chat-messages" id="chat-display"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="chat-text" placeholder="Type a message..." style="flex-grow:1;" onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="btn primary-btn" style="width:auto; padding:0 20px;" onclick="sendMessage()">Send</button>
            </div>
            <button class="btn" style="padding:5px; font-size:0.85rem;" onclick="location.reload()">Disconnect</button>
        </div>
    </div>
    <footer><span>N·E·X</span> NexGen Corp. &bull; 2026 &bull; All Rights Reserved.</footer>
    <script>
        firebase.initializeApp({ databaseURL: "https://firebasedatabase.app" });
        const dbRef = firebase.database().ref('global_chat_messages');
        let currentRole = "", currentUser = "", username = ""; 
        function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function checkSupportPass() {
            if (prompt("Enter Support Password:") === "Pero7373!") { currentRole = "support"; currentUser = "Petar (Support)"; switchScreen('screen-chat'); startLiveConnection(); }
            else { alert("❌ Incorrect Password!"); }
        }
        function loginAsUser() {
            let inputName = document.getElementById('user-alias').value.trim();
            if (!inputName) return alert("Please enter a name.");
            currentRole = "user"; username = inputName; switchScreen('screen-chat'); startLiveConnection();
        }
        function startLiveConnection() {
            dbRef.limitToLast(50).on('value', (snap) => {
                const display = document.getElementById('chat-display'); display.innerHTML = ""; const data = snap.val();
                if (data) {
                    Object.keys(data).forEach(k => {
                        const m = data[k];
                        display.innerHTML += `<div class="msg ${m.role}"><div class="msg-meta">${m.sender}</div><div>${m.text}</div></div>`;
                    });
                    display.scrollTop = display.scrollHeight;
                }
            });
        }
        function sendMessage() {
            const input = document.getElementById('chat-text'); const text = input.value.trim(); if (!text) return;
            dbRef.push({ sender: (currentRole === 'support') ? currentUser : username, text: text, role: currentRole }); input.value = "";
        }
    </script>
</body>
</html>
